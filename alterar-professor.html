<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alterar professor - Gestão Escolar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Gestão Escolar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Aluno</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="inserir-aluno.html">Matricular Novo Aluno</a></li>
                            <li><a class="dropdown-item" href="procurar-aluno.html">Acessar / Consultar Aluno</a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Professor</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="inserir-professor.html">Cadastrar Professor</a></li>
                            <li><a class="dropdown-item" href="procurar-professor.html">Consultar Professor</a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Sala</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="inserir-sala.html">Cadastrar Sala</a></li>
                            <li><a class="dropdown-item" href="procurar-sala.html">Consultar Sala</a></li>
                        </ul>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
  <main class="container my-4">
    <h1 class="h3 mb-4">Alterar professor</h1>
    <form action="procurar-professor.html" method="get">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome (texto)</label>
        <input type="text" class="form-control" id="nome" name="nome" value="Maria Silva" required>
      </div>
      <div class="mb-3">
        <label for="cargaHoraria" class="form-label">Carga horária semanal (inteiro)</label>
        <input type="number" class="form-control" id="cargaHoraria" name="cargaHoraria" min="1" step="1" value="20" required>
      </div>
      <div class="mb-3">
        <label for="salario" class="form-label">Salário em R$ (decimal)</label>
        <input type="number" class="form-control" id="salario" name="salario" min="0" step="0.01" value="4500.00" required>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="efetivo" name="efetivo" checked>
        <label class="form-check-label" for="efetivo">Professor efetivo (sim/não)</label>
      </div>
      <button type="submit" class="btn btn-primary">Salvar alterações</button>
      <a href="procurar-professor.html" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

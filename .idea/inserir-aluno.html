<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matricular Novo Aluno - Gestão Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Gestão Escolar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Aluno</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item active" href="inserir-aluno.html">Matricular Novo Aluno</a></li>
                            <li><a class="dropdown-item" href="procurar-aluno.html">Acessar / Consultar Aluno</a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Professor</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="inserir-professor.html">Cadastrar Professor</a></li>
                            <li><a class="dropdown-item" href="procurar-professor.html">Consultar Professor</a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Sala</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="inserir-sala.html">Cadastrar Sala</a></li>
                            <li><a class="dropdown-item" href="procurar-sala.html">Consultar Sala</a></li>
                        </ul>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0">Matricular Novo Aluno</h1>
                    </div>
                    <div class="card-body">
                        <form action="#" method="POST">
                            <div class="mb-3">
                                <label for="nomeAluno" class="form-label">Nome Completo (String)</label>
                                <input type="text" class="form-control" id="nomeAluno" name="nomeAluno" placeholder="Ex: Lucas Silva" required>
                            </div>
                            <div class="mb-3">
                                <label for="numeroMatricula" class="form-label">Número de Matrícula (Integer)</label>
                                <input type="number" step="1" class="form-control" id="numeroMatricula" name="numeroMatricula" placeholder="Ex: 20261001" required>
                            </div>
                            <div class="mb-3">
                                <label for="coeficienteRendimento" class="form-label">Coeficiente de Rendimento - CR (Float)</label>
                                <input type="number" step="0.01" min="0" max="10" class="form-control" id="coeficienteRendimento" name="coeficienteRendimento" placeholder="Ex: 8.75" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label d-block">Situação de Bolsa (Boolean)</label>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="isBolsista" name="isBolsista" value="true">
                                    <label class="form-check-label" for="isBolsista">Aluno é Bolsista?</label>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end gap-2">
                                <a href="index.html" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Salvar Matrícula</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
